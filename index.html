<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RouteBoy Pro — Ultimate Tracking</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A0F1E; --primary: #F2653A; --mint: #2AC2A6; --paper: #F8F9FC; --slate: #64748B; --white: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--paper); height: 100vh; overflow: hidden; }

  /* LOGIN PAGE */
  #loginPage { position: fixed; inset: 0; background: var(--navy); z-index: 2000; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; }
  .login-card { background: #161C2D; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .login-card h2 { font-family: 'Space Grotesk'; font-size: 28px; margin-bottom: 20px; text-align: center; }
  .login-card select, .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #2D3748; background: #0A0F1E; color: white; }
  .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }

  /* MAIN LAYOUT */
  #header { height: 60px; background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; }
  .logo { font-family: 'Space Grotesk'; font-weight: bold; font-size: 20px; }
  #app { display: flex; height: calc(100vh - 60px); }
  
  #sidebar { width: 400px; background: white; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column; transition: 0.3s; }
  #map { flex: 1; position: relative; }

  /* MOBILE RESPONSIVE */
  @media (max-width: 768px) {
    #app { flex-direction: column-reverse; }
    #sidebar { width: 100%; height: 50%; }
  }

  .scroll-area { flex: 1; overflow-y: auto; padding: 20px; }
  .tabs { display: flex; border-bottom: 1px solid #eee; }
  .tab-btn { flex: 1; padding: 15px; border: none; background: none; font-weight: 600; color: var(--slate); cursor: pointer; }
  .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

  /* CARDS */
  .card { background: #fcfcfc; border: 1px solid #edf2f7; padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; }
  .status-badge { font-size: 10px; padding: 4px 8px; border-radius: 20px; font-weight: bold; float: right; }
  .status-pending { background: #FFF7ED; color: #C2410C; }
  .status-done { background: #ECFDF5; color: #047857; }

  /* MAP ICONS */
  .marker-boy { background: var(--navy); border: 2px solid white; border-radius: 50%; width: 35px; height: 35px; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
  .marker-house { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: white; padding: 12px 25px; border-radius: 50px; z-index: 3000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <h2>RouteBoy Pro</h2>
    <select id="loginRole" onchange="toggleLoginInputs()">
      <option value="admin">Login as Admin</option>
      <option value="delivery">Login as Delivery Boy</option>
    </select>
    <div id="boySelection" style="display:none;">
      <select id="boyIdentity"><option value="">Select Your Name</option></select>
    </div>
    <input type="password" id="loginPass" placeholder="Enter Password">
    <button class="btn-login" onclick="handleLogin()">Login System</button>
  </div>
</div>

<!-- HEADER -->
<div id="header">
  <div class="logo">RouteBoy PRO</div>
  <div id="userLabel" style="font-size: 14px; opacity: 0.8;"></div>
  <button onclick="logout()" style="background:none; border:1px solid #333; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Logout</button>
</div>

<div id="app">
  <div id="sidebar">
    <!-- ADMIN SIDEBAR -->
    <div id="adminPanel" style="display:none; height:100%;">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('orders')">Orders</button>
        <button class="tab-btn" onclick="switchTab('fleet')">Fleet</button>
      </div>
      <div class="scroll-area">
        <div id="tab-orders">
          <h3>Add Delivery</h3>
          <input type="text" id="custName" placeholder="Customer Name" style="width:100%; padding:10px; margin:10px 0;">
          <input type="text" id="custPhone" placeholder="Phone Number" style="width:100%; padding:10px; margin-bottom:10px;">
          <select id="assignTo" style="width:100%; padding:10px; margin-bottom:10px;"></select>
          <p style="font-size:11px; color:var(--primary);">*Map par click karke house select karein</p>
          <button class="btn-login" onclick="saveOrder()" style="margin:10px 0;">Assign House Location</button>
          <div id="orderList"></div>
        </div>
        <div id="tab-fleet" style="display:none;">
          <h3>Management</h3>
          <input type="text" id="newBoyName" placeholder="New Boy Name" style="width:100%; padding:10px; margin:10px 0;">
          <button class="btn-login" onclick="addBoy()">Add Delivery Boy</button>
          <div id="fleetList" style="margin-top:20px;"></div>
        </div>
      </div>
    </div>

    <!-- DELIVERY SIDEBAR -->
    <div id="deliveryPanel" style="display:none; height:100%;">
      <div class="scroll-area">
        <div id="gpsAlert" style="background:#ECFDF5; color:#047857; padding:10px; border-radius:8px; margin-bottom:15px; font-size:12px; font-weight:bold;">
          🟢 GPS Live Tracking is ON
        </div>
        <div id="boyTasks"></div>
      </div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4q2qD7K7o5yN5v9H9jSIvWsTPWlAvurY",
    authDomain: "delivry-tracking-system.firebaseapp.com",
    databaseURL: "https://delivry-tracking-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "delivry-tracking-system",
    storageBucket: "delivry-tracking-system.firebasestorage.app",
    messagingSenderId: "181704924735",
    appId: "1:181704924735:web:7c57448137e91b745ca28a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let boys = {}, orders = {}, currentUser = null, selectedLatLng = null;
  let boyMarkers = {}, orderMarkers = {}, pathLines = {};
  let watchId = null;

  const map = L.map('map').setView([28.61, 77.20], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // --- AUTH SYSTEM ---
  window.toggleLoginInputs = () => {
    const role = document.getElementById('loginRole').value;
    document.getElementById('boySelection').style.display = role === 'delivery' ? 'block' : 'none';
  };

  window.handleLogin = () => {
    const role = document.getElementById('loginRole').value;
    const pass = document.getElementById('loginPass').value;
    const boyId = document.getElementById('boyIdentity').value;

    if (role === 'admin' && pass === 'admin123') {
      currentUser = { role: 'admin' };
    } else if (role === 'delivery' && pass === '123' && boyId) {
      currentUser = { role: 'delivery', id: boyId, name: boys[boyId].name };
      startGPS();
    } else {
      return alert("Invalid Password or Selection!");
    }

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('userLabel').innerText = currentUser.role === 'admin' ? "Admin Mode" : "Driver: " + currentUser.name;
    initView();
  };

  window.logout = () => { location.reload(); };

  function initView() {
    document.getElementById('adminPanel').style.display = currentUser.role === 'admin' ? 'block' : 'none';
    document.getElementById('deliveryPanel').style.display = currentUser.role === 'delivery' ? 'block' : 'none';
    render();
  }

  // --- DATABASE LISTENERS ---
  onValue(ref(db, 'boys'), (snap) => {
    boys = snap.val() || {};
    const boyOpts = Object.entries(boys).map(([id, b]) => `<option value="${id}">${b.name}</option>`).join('');
    document.getElementById('boyIdentity').innerHTML = '<option value="">Select Your Name</option>' + boyOpts;
    document.getElementById('assignTo').innerHTML = '<option value="">Unassigned</option>' + boyOpts;
    render();
  });

  onValue(ref(db, 'orders'), (snap) => {
    orders = snap.val() || {};
    render();
  });

  // --- ADMIN ACTIONS ---
  window.addBoy = () => {
    const name = document.getElementById('newBoyName').value;
    if (!name) return;
    push(ref(db, 'boys'), { name, lat: 0, lng: 0, status: 'offline' });
    document.getElementById('newBoyName').value = '';
    showToast("Delivery boy added!");
  };

  map.on('click', (e) => {
    if (currentUser?.role !== 'admin') return;
    selectedLatLng = e.latlng;
    L.marker(e.latlng).addTo(map).bindPopup("House Location Selected").openPopup();
  });

  window.saveOrder = () => {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const bId = document.getElementById('assignTo').value;
    if (!name || !selectedLatLng) return alert("Fill name & Click house on map!");

    push(ref(db, 'orders'), {
      name, phone, lat: selectedLatLng.lat, lng: selectedLatLng.lng,
      assignedTo: bId, status: 'pending', timestamp: Date.now()
    });
    showToast("Order Assigned!");
    selectedLatLng = null;
  };

  // --- DELIVERY ACTIONS ---
  function startGPS() {
    if (navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition((pos) => {
        update(ref(db, `boys/${currentUser.id}`), {
          lat: pos.coords.latitude, lng: pos.coords.longitude, status: 'online'
        });
      }, null, { enableHighAccuracy: true });
    }
  }

  window.markDone = (id) => {
    update(ref(db, `orders/${id}`), { status: 'completed' });
    showToast("Delivery Done!");
    
    // Check if last delivery
    const remaining = Object.values(orders).filter(o => o.assignedTo === currentUser.id && o.status === 'pending').length;
    if (remaining === 1) { // Current one is the last
      navigator.geolocation.clearWatch(watchId);
      update(ref(db, `boys/${currentUser.id}`), { status: 'offline' });
      showToast("All done! GPS turned off.");
    }
  };

  // --- RENDER ENGINE ---
  function render() {
    // Clear Map
    Object.values(boyMarkers).forEach(m => map.removeLayer(m));
    Object.values(orderMarkers).forEach(m => map.removeLayer(m));
    Object.values(pathLines).forEach(l => map.removeLayer(l));

    // Render Boys
    Object.entries(boys).forEach(([id, b]) => {
      if (b.lat) {
        boyMarkers[id] = L.marker([b.lat, b.lng], {
          icon: L.divIcon({ className: '', html: `<div class="marker-boy" style="background:${b.status==='online'?'#2AC2A6':'#333'}">${b.name[0]}</div>` })
        }).addTo(map).bindPopup(b.name + ` (${b.status})`);
      }
    });

    // Render Orders & Path Lines
    const boyPaths = {};

    Object.entries(orders).forEach(([id, o]) => {
      const isDone = o.status === 'completed';
      const color = isDone ? '#2AC2A6' : '#F2653A';
      
      orderMarkers[id] = L.marker([o.lat, o.lng], {
        icon: L.divIcon({ className: '', html: `<div class="marker-house" style="background:${color}">${isDone?'✓':'!'}</div>` })
      }).addTo(map).bindPopup(`<b>${o.name}</b><br>${o.phone}`);

      // Path collection
      if (!isDone && o.assignedTo && boys[o.assignedTo]?.lat) {
        if (!boyPaths[o.assignedTo]) boyPaths[o.assignedTo] = [[boys[o.assignedTo].lat, boys[o.assignedTo].lng]];
        boyPaths[o.assignedTo].push([o.lat, o.lng]);
      }
    });

    // Draw Live Paths
    Object.entries(boyPaths).forEach(([bId, points]) => {
      pathLines[bId] = L.polyline(points, { color: '#F2653A', weight: 3, dashArray: '10, 10', opacity: 0.5 }).addTo(map);
    });

    // Sidebar Lists
    if (currentUser?.role === 'admin') {
      document.getElementById('orderList').innerHTML = Object.entries(orders).map(([id, o]) => `
        <div class="card">
          <span class="status-badge status-${o.status}">${o.status}</span>
          <b>${o.name}</b><br><small>Assigned: ${boys[o.assignedTo]?.name || 'No One'}</small>
        </div>
      `).join('');
      
      document.getElementById('fleetList').innerHTML = Object.entries(boys).map(([id, b]) => `
        <div class="card">
          <span class="status-badge" style="background:${b.status==='online'?'#2AC2A6':'#eee'}; color:${b.status==='online'?'white':'#999'}">${b.status}</span>
          <b>${b.name}</b>
        </div>
      `).join('');
    } else if (currentUser?.role === 'delivery') {
      const myOrders = Object.entries(orders).filter(([id, o]) => o.assignedTo === currentUser.id && o.status === 'pending');
      const me = boys[currentUser.id];
      
      // Nearest Sort Logic
      if (me?.lat) {
        myOrders.sort((a,b) => {
          const distA = Math.hypot(a[1].lat - me.lat, a[1].lng - me.lng);
          const distB = Math.hypot(b[1].lat - me.lat, b[1].lng - me.lng);
          return distA - distB;
        });
      }

      document.getElementById('boyTasks').innerHTML = myOrders.map(([id, o], index) => {
        const dist = me?.lat ? (Math.hypot(o.lat - me.lat, o.lng - me.lng) * 111).toFixed(2) : "?";
        return `
        <div class="card" style="${index === 0 ? 'border-left: 5px solid var(--primary)' : ''}">
          <button class="btn-login" onclick="markDone('${id}')" style="width:auto; float:right; padding:5px 15px; background:var(--mint);">Done</button>
          <b>${o.name}</b><br>
          <small>${o.phone}</small><br>
          <div style="margin-top:10px; font-size:12px; color:var(--slate);">📍 Distance: ${dist} KM | Stop #${index+1}</div>
          ${index === 0 ? '<div style="color:var(--primary); font-size:11px; font-weight:bold; margin-top:5px;">NEXT TARGET HOUSE</div>' : ''}
        </div>
      `}).join('') || "<h3>No pending deliveries! 🎉</h3>";
    }
  }

  function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
  window.switchTab = (t) => {
    document.getElementById('tab-orders').style.display = t === 'orders' ? 'block' : 'none';
    document.getElementById('tab-fleet').style.display = t === 'fleet' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(t)));
  };

</script>
</body>
</html>
